{% load static %}
<!DOCTYPE html>
<html lang="ar" dir="rtl" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}{% if title %}{{ title }}{% else %}جمعية قيادة الذات{% endif %}{% endblock title %}</title>
    
    <!-- ⚡ منع الوميض وتأكيد ضبط الثيم -->
    <script>
        (function() {
            const savedTheme = localStorage.getItem('theme') || 'light';
            document.documentElement.setAttribute('data-bs-theme', savedTheme);
        })();
    </script>

    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="{% static 'img/favicon.ico' %}">

    <!-- Bootstrap 5 CSS (RTL) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css">
    
    <!-- Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.lineicons.com/4.0/lineicons.css">

    <!-- Bootstrap Table CSS -->
    <link rel="stylesheet" href="https://unpkg.com/bootstrap-table@1.22.1/dist/bootstrap-table.min.css">
    <link rel="stylesheet" href="https://unpkg.com/bootstrap-table@1.22.1/dist/extensions/filter-control/bootstrap-table-filter-control.css">

    <!-- AOS Animation CSS -->
    <link rel="stylesheet" href="https://unpkg.com/aos@2.3.1/dist/aos.css">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="{% static 'css/style.css' %}">

    <!-- 🎨 تخصيص لوحة الألوان المعتمدة (زيتي، بيج، دهبي) -->
    <style>
        :root, [data-bs-theme="light"] {
            --brand-olive: #2D3B2D;         /* زيتي داكن أنيق */
            --brand-olive-light: #3D4F3D;   /* زيتي فاتح للمؤشرات */
            --brand-gold: #C5A059;          /* ذهبي راقي */
            --brand-gold-hover: #b38e47;    /* ذهبي أغمق للـ Hover */
            --brand-beige: #FAF6F0;         /* بيج فاتح وخفيف للأسطح */
            --brand-beige-dark: #EFE8DC;    /* بيج أغمق قليلاً للحدود */

            /* إعادة إسناد متغيرات Bootstrap العامة */
            --bs-primary: var(--brand-olive);
            --bs-primary-rgb: 45, 59, 45;
            --bs-body-bg: var(--brand-beige);
            --bs-body-color: #212529;
        }

        [data-bs-theme="dark"] {
            --brand-olive: #3D4F3D;
            --brand-gold: #D4AF37;
            --brand-gold-hover: #e0bc43;
            --brand-beige: #1A211A;         /* خلفية داكنة مسحوبة من الزيتي */
            --brand-beige-dark: #2A352A;

            --bs-primary: var(--brand-gold);
            --bs-primary-rgb: 212, 175, 55;
            --bs-body-bg: #121812;
            --bs-body-color: #EAEAEA;
        }

        /* كلاسات مخصصة للألوان */
        .bg-olive { background-color: var(--brand-olive) !important; }
        .text-olive { color: var(--brand-olive) !important; }
        .bg-gold { background-color: var(--brand-gold) !important; }
        .text-gold { color: var(--brand-gold) !important; }
        .btn-gold {
            background-color: var(--brand-gold);
            color: #ffffff !important;
            border: none;
        }
        .btn-gold:hover {
            background-color: var(--brand-gold-hover);
            color: #ffffff !important;
        }
        .btn-outline-gold {
            border-color: var(--brand-gold);
            color: var(--brand-gold);
        }
        .btn-outline-gold:hover {
            background-color: var(--brand-gold);
            color: #ffffff !important;
        }
    </style>
</head>
<body class="d-flex flex-column min-vh-100">
    <canvas id="bg-canvas" style="position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: -1; pointer-events: none;"></canvas>
    <!-- Header -->
    {% include 'core/header.html' %}

    <!-- Main Content -->
    <main class="flex-shrink-0 py-4">
        {% block content %}
        {% endblock %}
    </main>

    <!-- Footer -->
    {% include 'core/footer.html' %}

    <!-- Core Scripts -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Bootstrap Table & Extensions -->
    <script src="https://unpkg.com/bootstrap-table@1.22.1/dist/bootstrap-table.min.js"></script>
    <script src="https://unpkg.com/bootstrap-table@1.22.1/dist/locale/bootstrap-table-ar-SA.min.js"></script>
    <script src="https://unpkg.com/bootstrap-table@1.22.1/dist/extensions/filter-control/bootstrap-table-filter-control.js"></script>
    <script src="https://unpkg.com/bootstrap-table@1.22.1/dist/extensions/export/bootstrap-table-export.min.js"></script>
    
    <!-- Table Export Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
    <script src="https://unpkg.com/tableexport.jquery.plugin/tableExport.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/arabic-persian-text/dist/arabic.min.js"></script>
    <script src="https://unpkg.com/bootstrap-table@1.22.1/dist/extensions/page-jump-to/bootstrap-table-page-jump-to.min.js"></script>

    <!-- UI Enhancements -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>

    <!-- Global App Scripts -->
    <script>
        AOS.init({
            duration: 800,
            once: true
        });

        document.addEventListener('DOMContentLoaded', function () {
            const themeBtn = document.getElementById('themeToggleBtn');
            const themeIcon = document.getElementById('themeIcon');

            const currentTheme = document.documentElement.getAttribute('data-bs-theme') || 'light';
            if (themeIcon) {
                themeIcon.className = currentTheme === 'dark' ? 'bi bi-sun-fill' : 'bi bi-moon-stars-fill';
            }

            if (themeBtn) {
                themeBtn.addEventListener('click', function () {
                    const activeTheme = document.documentElement.getAttribute('data-bs-theme');
                    const newTheme = activeTheme === 'dark' ? 'light' : 'dark';

                    document.documentElement.setAttribute('data-bs-theme', newTheme);
                    localStorage.setItem('theme', newTheme);

                    if (themeIcon) {
                        themeIcon.className = newTheme === 'dark' ? 'bi bi-sun-fill' : 'bi bi-moon-stars-fill';
                    }
                });
            }
        });
    </script>

    {% block extra_js %}{% endblock %}
    <script>
        (function () {
    const canvas = document.getElementById('bg-canvas');
    if (!canvas) return;
    
    const ctx = canvas.getContext('2d');
    let width, height, particles;

    // ضبط أحجام الـ Canvas
    function resize() {
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;
    }

    // تحديد ألوان الجسيمات والخطوط حسب وضع الإضاءة (Dark / Light)
    function getThemeColors() {
        const isDarkMode = document.documentElement.getAttribute('data-bs-theme') === 'dark' || 
                           window.matchMedia('(prefers-color-scheme: dark)').matches;
        
        return isDarkMode 
            ? { particle: 'rgba(212, 175, 55, 0.35)', line: 'rgba(212, 175, 55, 0.08)' }   // لون ذهبي خافت للداكن
            : { particle: 'rgba(114, 129, 99, 0.25)', line: 'rgba(114, 129, 99, 0.06)' };  // لون زيتوني خافت للفاتح
    }

    // إنشاء الجسيمات
    function createParticles() {
        particles = [];
        const count = Math.floor((width * height) / 18000); // كثافة متناسقة مع حجم الشاشة
        for (let i = 0; i < count; i++) {
            particles.push({
                x: Math.random() * width,
                y: Math.random() * height,
                vx: (Math.random() - 0.5) * 0.4, // سرعة حركة خفيفة جداً
                vy: (Math.random() - 0.5) * 0.4,
                radius: Math.random() * 2 + 1.5
            });
        }
    }

    // رسم وتحريك العناصر
    function animate() {
        ctx.clearRect(0, 0, width, height);
        const colors = getThemeColors();

        for (let i = 0; i < particles.length; i++) {
            let p = particles[i];

            // تحديث الحركات
            p.x += p.vx;
            p.y += p.vy;

            // إعادة الجسيم للشاشة عند حوافه
            if (p.x < 0) p.x = width;
            if (p.x > width) p.x = 0;
            if (p.y < 0) p.y = height;
            if (p.y > height) p.y = 0;

            // رسم الجسيم
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
            ctx.fillStyle = colors.particle;
            ctx.fill();

            // رسم خيوط اتصال بين النقاط القريبة
            for (let j = i + 1; j < particles.length; j++) {
                let p2 = particles[j];
                let dist = Math.hypot(p.x - p2.x, p.y - p2.y);
                if (dist < 120) {
                    ctx.beginPath();
                    ctx.moveTo(p.x, p.y);
                    ctx.lineTo(p2.x, p2.y);
                    ctx.strokeStyle = colors.line;
                    ctx.lineWidth = 1;
                    ctx.stroke();
                }
            }
        }
        requestAnimationFrame(animate);
    }

    // بدء التشغيل وإعادة ضبط الأبعاد
    window.addEventListener('resize', () => { resize(); createParticles(); });
    
    // مراقبة تغيير الثيم (Dark/Light Mode)
    const observer = new MutationObserver(() => animate());
    observer.observe(document.documentElement, { attributes: true, attributeFilter: ['data-bs-theme'] });

    resize();
    createParticles();
    animate();
})();
    </script>
