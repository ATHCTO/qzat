{% extends 'core/base.html' %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center my-5">
        <div class="col-12 col-md-8 col-lg-5">
            <div class="card border-0 shadow-lg rounded-4 overflow-hidden">
                <div class="card-header bg-primary text-white text-center py-4 border-0">
                    <div class="mb-2">
                        <i class="bi bi-person-circle fs-1"></i>
                    </div>
                    <h4 class="fw-bold mb-0">تسجيل الدخول</h4>
                    <p class="small mb-0 text-white-50 mt-1">أدخل بياناتك للمتابعة إلى حسابك</p>
                </div>
                <div class="card-body p-4 p-md-5 bg-body-tertiary">
                    <form method="POST" action="{% url 'login' %}">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label class="form-label fw-semibold text-body">اسم المستخدم</label>
                            <div class="input-group">
                                <span class="input-group-text bg-body border-end-0 rounded-start-3 text-body-secondary">
                                    <i class="bi bi-person"></i>
                                </span>
                                <input type="text" name="username" class="form-control bg-body border-start-0 rounded-end-3" placeholder="أدخل اسم المستخدم" required autofocus>
                            </div>
                        </div>
                        <div class="mb-4">
                            <div class="d-flex justify-content-between align-items-center mb-1">
                                <label class="form-label fw-semibold text-body mb-0">كلمة المرور</label>
                            </div>
                            <div class="input-group">
                                <span class="input-group-text bg-body border-end-0 rounded-start-3 text-body-secondary">
                                    <i class="bi bi-lock"></i>
                                </span>
                                <input type="password" name="password" class="form-control bg-body border-start-0 rounded-end-3" placeholder="••••••••" required>
                            </div>
                        </div>
                        <button type="submit" class="btn btn-primary w-100 rounded-pill py-2.5 fw-bold shadow-sm fs-6">
                            <i class="bi bi-box-arrow-in-right me-1"></i> دخول
                        </button>
                    </form>
                </div>
            </div>

        </div>
    </div>
</div>
<div class="custom-toast-container position-fixed top-0 start-50 translate-middle-x p-3 mt-5">
    {% if messages %}
        {% for message in messages %}
            <div class="custom-toast {{ message.tags }} shadow-lg auto-toast" role="alert" data-bs-delay="5000">
                <div class="toast-content d-flex align-items-center justify-content-between p-3">
                    <div class="d-flex align-items-center gap-2">
                        <span class="status-icon"></span>
                        <span class="toast-message">{{ message }}</span>
                    </div>
                    <button type="button" class="btn-close-custom ms-3" onclick="this.closest('.custom-toast').remove()">✕</button>
                </div>
                <div class="progress-bar-timer"></div>
            </div>
        {% endfor %}
    {% endif %}
</div>
<style>
.custom-toast-container {
    z-index: 9999;
    min-width: 320px;
    max-width: 90%;
}

.custom-toast {
    background: #1e232a;
    border: 1px solid rgba(212, 175, 55, 0.3);
    border-radius: 12px;
    color: #ffffff;
    position: relative;
    overflow: hidden;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    backdrop-filter: blur(8px);
    animation: slideDown 0.4s ease-out forwards;
}

.custom-toast.error, .custom-toast.danger {
    border-right: 5px solid #ff4d4d;
}
.custom-toast.error .status-icon::before { content: "⚠️"; }

.custom-toast.success {
    border-right: 5px solid #28a745;
}
.custom-toast.success .status-icon::before { content: "✅"; }

.custom-toast.info {
    border-right: 5px solid #d4af37;
}
.custom-toast.info .status-icon::before { content: "ℹ️"; }

.toast-message {
    font-size: 0.95rem;
    font-weight: 500;
}

.btn-close-custom {
    background: transparent;
    border: none;
    color: #a0a0a0;
    font-size: 1rem;
    cursor: pointer;
    transition: 0.2s;
}
.btn-close-custom:hover {
    color: #ffffff;
}

.progress-bar-timer {
    height: 3px;
    background: #d4af37;
    width: 100%;
    animation: countdown 5s linear forwards;
}

@keyframes slideDown {
    from { opacity: 0; transform: translateY(-20px); }
    to { opacity: 1; transform: translateY(0); }
}

@keyframes countdown {
    from { width: 100%; }
    to { width: 0%; }
}
</style>

<script>
    document.addEventListener('DOMContentLoaded', function () {
        var toasts = document.querySelectorAll('.auto-toast');
        toasts.forEach(function (toast) {
            setTimeout(function () {
                toast.style.transition = "opacity 0.5s ease, transform 0.5s ease";
                toast.style.opacity = "0";
                toast.style.transform = "translateY(-10px)";
                setTimeout(function() { toast.remove(); }, 500);
            }, 5000);
        });
    });
</script>
{% endblock %}
