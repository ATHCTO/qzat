{% extends 'core/base.html' %}
{% load static %}

{% block title %}تم تغيير كلمة المرور بنجاح{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card shadow-sm border-0 rounded-3 text-center p-4">
                <div class="card-body">
                    <!-- أيقونة النجاح -->
                    <div class="mb-4">
                        <div class="bg-success-subtle text-success d-inline-flex align-items-center justify-content-center rounded-circle" style="width: 80px; height: 80px;">
                            <i class="fas fa-check-circle fa-3x"></i>
                        </div>
                    </div>

                    <h3 class="card-title fw-bold text-dark mb-3">تم تغيير كلمة المرور بنجاح!</h3>
                    
                    <p class="text-muted mb-4 fs-6">
                        تم تحديث كلمة المرور الخاصة بحسابك بنجاح. يمكنك الآن استخدام كلمة المرور الجديدة في عملية تسجيل الدخول.
                    </p>

                    <!-- زر العودة -->
                    <div class="d-grid">
                        <a href="{% url 'login' %}" class="btn btn-success btn-lg fs-6">
                            <i class="fas fa-home me-2"></i>تسجيل الدخول
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
